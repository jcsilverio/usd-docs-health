name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Register kernel
        run: python -m ipykernel install --sys-prefix --name python3

      - name: Test
        run: python -m pytest

      - name: Corpus check
        run: |
          set +e
          python -m usd_docs_health check --corpus vendor/learnopenusd --format json | tee static-report.json
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 1 ]; then
            exit 0
          fi
          exit "$code"

      - name: Upload static report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          path: static-report.json
          if-no-files-found: error
          archive: false
